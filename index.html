<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiki Tide">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tiki Tide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; height: 100%; background: #120a1f; overflow: hidden; }
canvas { display: block; position: fixed; image-rendering: pixelated; }
html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.touch { --s: 1; }
.stickzone, .stickbase, .tbtn, .rotate { display: none; }
body.touch .stickzone { display: block; position: fixed; left: 0; bottom: 0; width: 45vw; height: 72vh; height: 72svh; }
body.touch .stickbase { display: block; position: fixed; pointer-events: none; width: calc(82px * var(--s)); height: calc(82px * var(--s)); left: calc(env(safe-area-inset-left) + 26px); bottom: 20px; border-radius: 50%; border: 2px solid rgba(255, 230, 128, 0.45); background: rgba(20, 10, 40, 0.3); opacity: 0.35; }
body.touch .stickbase.on { opacity: 1; }
.stickknob { position: absolute; left: 27%; top: 27%; width: 46%; height: 46%; border-radius: 50%; background: rgba(255, 230, 128, 0.6); }
body.touch .tbtn { display: flex; align-items: center; justify-content: center; position: fixed; border-radius: 50%; border: 2px solid rgba(255, 230, 128, 0.6); background: rgba(20, 10, 40, 0.4); color: #ffe680; font: bold calc(12px * var(--s)) monospace; }
.tbtn.on { background: rgba(255, 230, 128, 0.45) !important; }
.tbtn.a { right: calc(env(safe-area-inset-right) + 20px); bottom: 26px; width: calc(80px * var(--s)); height: calc(80px * var(--s)); font-size: calc(26px * var(--s)) !important; }
.tbtn.jump { right: calc(env(safe-area-inset-right) + 20px + 92px * var(--s)); bottom: 14px; width: calc(68px * var(--s)); height: calc(68px * var(--s)); }
.tbtn.look { right: calc(env(safe-area-inset-right) + 26px); bottom: calc(36px + 84px * var(--s)); width: calc(58px * var(--s)); height: calc(58px * var(--s)); font-size: calc(11px * var(--s)) !important; }
body.sea .tbtn.jump, body.sea .tbtn.look { display: none; }
body.paused .tbtn, body.paused .stickbase, body.paused .stickzone { display: none; }
@media (orientation: portrait) {
  body.touch .rotate { display: flex; position: fixed; inset: 0; z-index: 9; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #120a1f; color: #ffe680; font: 18px monospace; }
}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
const BUILD = '21';
fetch(`version.txt?${Date.now()}`, { cache: 'no-store' })
  .then(r => r.text())
  .then(v => {
    const latest = v.trim();
    if (latest && latest !== BUILD && !location.search.includes(`v=${latest}`)) location.replace(`${location.pathname}?v=${latest}`);
  })
  .catch(() => {});
</script>
<script src="js/core.js?v=21"></script>
<script src="js/audio.js?v=21"></script>
<script src="js/art.js?v=21"></script>
<script src="js/ui.js?v=21"></script>
<script src="js/areas.js?v=21"></script>
<script src="js/islands.js?v=21"></script>
<script src="js/main.js?v=21"></script>
<script src="js/touch.js?v=21"></script>
</body>
</html>
